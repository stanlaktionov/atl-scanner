[project]
name = "atl-scanner"
version = "0.1.0"
description = "Local crypto screener: coins near all-time low, collected for research only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]

[project.scripts]
atl-scanner = "atl_scanner.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atl_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call real APIs (deselected by default)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
